<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Çukur ayna yüzeyi çizimi</title>
  <desc id="desc">Ortası geride, kenarları önde görünen içbükey gümüş ayna yüzeyi.</desc>
  <defs>
    <radialGradient id="bowl" cx="50%" cy="50%" r="53%">
      <stop offset="0" stop-color="#455a61"/>
      <stop offset="0.38" stop-color="#6f858b"/>
      <stop offset="0.66" stop-color="#bac8cb"/>
      <stop offset="0.84" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#52686e"/>
    </radialGradient>
    <radialGradient id="depth" cx="46%" cy="46%" r="56%">
      <stop offset="0" stop-color="#263d45" stop-opacity=".68"/>
      <stop offset="0.62" stop-color="#506970" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="110" cy="110" r="94"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#10252c" flood-opacity=".32"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="110" cy="110" r="99" fill="#17262c" stroke="#75888d" stroke-width="5"/>
    <circle cx="110" cy="110" r="92" fill="url(#bowl)" stroke="#dbe6e7" stroke-width="3"/>
    <circle cx="110" cy="110" r="78" fill="url(#depth)"/>
    <g clip-path="url(#disc)" fill="none">
      <ellipse cx="110" cy="111" rx="69" ry="67" stroke="#eaf2f3" stroke-width="4" opacity=".36"/>
      <ellipse cx="86" cy="76" rx="40" ry="17" stroke="#fff" stroke-width="9" opacity=".28" transform="rotate(-28 86 76)"/>
      <path d="M35 139c21 38 63 61 105 52" stroke="#314c54" stroke-width="8" opacity=".22"/>
    </g>
    <circle cx="110" cy="110" r="9" fill="#233b43" opacity=".42"/>
    <circle cx="110" cy="110" r="92" fill="none" stroke="#fff" stroke-width="3" opacity=".42"/>
  </g>
</svg>
