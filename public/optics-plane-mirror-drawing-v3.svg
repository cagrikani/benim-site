<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" role="img" aria-labelledby="title desc">
  <title id="title">Düzlem ayna çizimi</title>
  <desc id="desc">İnce siyah çerçeveli, düz ve gümüş renkli laboratuvar aynası.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66747a"/>
      <stop offset="0.45" stop-color="#17252b"/>
      <stop offset="1" stop-color="#070d10"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91a8ae"/>
      <stop offset="0.16" stop-color="#eef7f8"/>
      <stop offset="0.42" stop-color="#b7c9cd"/>
      <stop offset="0.7" stop-color="#fbffff"/>
      <stop offset="1" stop-color="#70868d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#10252c" flood-opacity=".3"/>
    </filter>
    <clipPath id="face"><rect x="46" y="13" width="68" height="214" rx="4"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="38" y="4" width="84" height="232" rx="8" fill="url(#frame)"/>
    <rect x="45" y="12" width="70" height="216" rx="4" fill="url(#glass)" stroke="#dce8ea" stroke-width="2"/>
    <g clip-path="url(#face)" opacity=".72">
      <path d="M28 100 92 6h31L58 103Z" fill="#fff" opacity=".62"/>
      <path d="m49 215 57-84h14l-54 84Z" fill="#fff" opacity=".28"/>
      <path d="M50 16v208" stroke="#fff" stroke-width="3" opacity=".38"/>
    </g>
    <rect x="39" y="5" width="82" height="230" rx="7" fill="none" stroke="#95a5aa" stroke-width="2" opacity=".65"/>
  </g>
</svg>
